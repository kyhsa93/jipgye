name: Build site

# 구조 B-3(#509, 부모 #505, #272 흡수): main HEAD(코드 + 데이터)에서 사이트를 build/site 로 새로 만들고, 기존 배포 산출물(= 커밋된 docs/)과
# 파일별 sha256 을 맞댄다. **배포는 하지 않는다** - 이 단계의 실제 게시는 daily-update.yml·summarize.yml·static.yml 이 그대로 한다.
# 배포 환경(github-pages)·pages/id-token 권한·deploy-pages 를 이 파일에 두는 순간 두 번째 배포 경로가 켜지고 컷오버(B4)가 된다
# (test/deploy-yml.test.mjs 가 막는다). 이름이 deploy.yml 인 것은 B4 에서 이 파일이 배포를 맡기 때문이고, 그때까지는 "산출 해시만" 만든다.
#
# 2틱 대조(합격선): 자연 full 틱(Daily -> Summarize) 두 번에서 이 워크플로의 "산출 해시 대조" 스텝이 연속으로 초록이고, 요약의 목록 해시가
# 두 줄 모두 A 와 B 가 같으면 통과다(수동 dispatch 는 증빙에 안 쓴다). 같은 SHA 의 재실행(Re-run) 목록끼리는 같은 명령으로 맞댄다:
#   node scripts/site-hashes.ts compare <내려받은 a.txt> <다른 실행의 b.txt>
# 렌더·해시가 수집 job 과 갈라져 이 워크플로만 재실행할 수 있다는 점이 #272 의 기대 효과 2번이다.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily update", "Summarize"]
    types: [completed]

# 읽기뿐이다. 시크릿도 안 쓴다 - 렌더는 커밋된 데이터만 읽고 외부 API 를 부르지 않는다(env 의 BUILD_NOW 하나가 전부).
permissions:
  contents: read

# digest-pipeline(수집·요약 직렬화)·pages(static.yml 의 배포)와 다른 그룹이다. 이 워크플로는 쓰는 것이 없어 수집과 겹쳐 돌아도 무해하고,
# 수집 틱을 기다리게 하지도 않는다. 같은 SHA 에 배포가 둘 겹치는 일은 배포가 없으니 생기지 않는다.
concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    # 취소된 상위 실행의 후속은 돌지 않는다. 실패한 Daily 도 데이터는 이미 커밋했을 수 있어 돌린다.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      # push 는 그 커밋을, workflow_run 은 지금의 main 을 받는다(daily-update·summarize 와 같다). 어느 쪽이든 아래 두 산출물은 이 체크아웃 하나에서 나온다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: npm ci

      # 예산 장의 "최근 6개월" 창이 Date.now() 를 읽는 유일한 렌더 입력이다(build-budget-pages.ts). 그대로 두면 UTC 자정을 넘겨 늦게 도는 실행(크론이
      # 2~6시간 늦는다)이 커밋된 docs/ 와 다른 날짜로 그려 오탐을 낸다. HEAD 커밋 시각으로 못박는다 - 데이터를 커밋한 쪽의 렌더가 그 직전이다.
      # 하루 단위 값이라 분 단위 차이는 영향이 없다. B4 에서 배포 산출물의 시각을 무엇으로 할지는 거기서 정한다(이 값은 대조용이다).
      - name: 렌더 시각 고정
        run: echo "BUILD_NOW=$(git log -1 --format=%cI HEAD)" >> "$GITHUB_ENV"

      # 출력 위치는 build/site 하나로 고정한다(사용자 입력 아님, #508 cto). render-pipeline 이 docs/ 를 복사한 뒤 여섯 단계를 그 복사본에서 돌린다.
      # React 렌더가 실패하면 legacy 로 폴백한다 - 이 워크플로의 맨 끝 "렌더 폴백 반영"이 그 날을 빨갛게 표시한다.
      - name: 사이트 생성 (build/site)
        id: render
        run: node scripts/render-pipeline.ts --out=build/site

      # A = 커밋된 docs/(기존 배포가 올리는 것), B = 방금 만든 build/site. 어긋나도 아래 테스트·목록 업로드는 돈다 - 맨 끝 "해시 어긋남 반영"이 빨갛게 끝낸다.
      - name: 산출 해시 대조
        id: hashes
        continue-on-error: true
        run: |
          echo "HEAD $(git rev-parse HEAD)"
          node scripts/site-hashes.ts compare docs build/site --out-dir=build/hashes

      # 최종 모양(B4)에서 배포 앞의 게이트가 될 시험이다. 지금은 커밋된 docs/ 를 읽으므로 test.yml 과 같은 신호이고, 배포는 이 결과를 기다리지 않는다.
      - name: 테스트
        run: npm test

      - name: 산출 해시 목록 업로드
        if: ${{ !cancelled() && steps.hashes.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-hashes-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/hashes
          retention-days: 30
          if-no-files-found: error

      # 아래 반영 단계는 모두 `!cancelled() &&` 로 시작한다 - 앞 반영 단계가 먼저 exit 1 해도 뒤 반영이 건너뛰어지지 않아 원인이 한 run 에 다 보인다.
      - name: 렌더 폴백 반영
        if: ${{ !cancelled() && steps.render.outputs.fallback == 'true' }}
        run: |
          echo "::error::React 렌더 실패 → legacy 로 폴백했음 - 위 '사이트 생성 (build/site)' 단계의 1차 시도 로그를 본다. 폴백 산출은 기존 배포와 다를 수 있다"
          exit 1

      - name: 해시 어긋남 반영
        if: ${{ !cancelled() && steps.hashes.outcome == 'failure' }}
        run: |
          echo "::error::build/site 가 커밋된 docs/ 와 다르다 - 위 '산출 해시 대조' 단계의 어긋난 파일 목록을 본다. 이 워크플로는 배포하지 않으므로 사이트는 영향이 없다"
          exit 1
