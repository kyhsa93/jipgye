name: Daily update

on:
  schedule:
    - cron: "7 23 * * *"
    - cron: "7 3 * * *"
    - cron: "7 7 * * *"
    - cron: "7 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "갱신 범위 (full=전체, news=뉴스만)"
        type: choice
        options: [full, news]
        default: full
      backfill:
        description: "실거래 원본 백필 상한 (비우면 50)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '7 23 * * *' && 'full' || 'news') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: npm ci

      - name: 테스트 (수집 전)
        run: npm test

      - name: 뉴스 수집
        run: node scripts/fetch-news.mjs

      - name: 시장 지표 수집
        if: env.MODE == 'full'
        run: |
          node scripts/fetch-market.mjs
          node scripts/fetch-price-index.mjs
          node scripts/fetch-indicators.mjs
          node scripts/fetch-district-index.mjs
          node scripts/fetch-move-in.mjs
        env:
          # 없으면 공개 sample 키로 돈다. 시크릿을 넣으면 열 건 제한이 풀린다.
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}

      - name: 실거래 수집
        if: env.MODE == 'full'
        run: |
          node scripts/fetch-realestate.mjs
          # 받은 원본은 바로 커밋한다. 뒤의 빌더나 다른 수집이 실패해도 그날 원본이
          # 사라지지 않게 - 2026-10-03에 금리 단계 하나가 175슬롯을 버렸다(#62).
          ./scripts/push-docs.sh "chore: 실거래 원본 $(TZ=Asia/Seoul date +%Y-%m-%d)" raw
          node scripts/build-realestate.mjs
          node scripts/build-budget-deals.ts
          node scripts/build-conversion.ts
          node scripts/build-cancellation.ts
          node scripts/build-renewal-facts.ts
          node scripts/build-floor-gap.ts
          node scripts/build-outlook.ts
          node scripts/build-indicators.ts
          node scripts/build-move-in.ts
          node scripts/build-complex-price.mjs
          node scripts/build-record-high.ts
          node scripts/build-district-change.ts
          node scripts/build-complex-ratio.mjs
          node scripts/build-rent-preview.ts
          node scripts/build-search-index.mjs
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MOLIT_API_ENDPOINT: ${{ secrets.MOLIT_API_ENDPOINT }}
          MOLIT_RENT_API_KEY: ${{ secrets.MOLIT_RENT_API_KEY }}
          MOLIT_RENT_API_ENDPOINT: ${{ secrets.MOLIT_RENT_API_ENDPOINT }}
          MOLIT_BACKFILL_LIMIT: ${{ inputs.backfill }}

      # 실패해도 여기서 job을 멈추지 않는다 - 뒤의 원본 커밋·배포가 먼저다(#62).
      # 네 상품군이 전부 실패했거나 키가 없으면 맨 끝 "금리 수집 실패 반영" 단계가 job을 실패로 끝낸다(#107).
      - name: 예·적금·대출 금리 수집
        id: rates
        if: env.MODE == 'full'
        continue-on-error: true
        run: node scripts/fetch-rates.mjs
        env:
          FSS_FINLIFE_API_KEY: ${{ secrets.FSS_FINLIFE_API_KEY }}

      # conversion.json은 rates.json의 대출 금리 중앙값·옵션 수를 읽는데, 첫 build-conversion은
      # 위 "실거래 수집" 단계 안에서 금리 수집보다 먼저 돈다. 금감원 공시월이 바뀐 날
      # (2026-10-22, 202609→202610) rates만 새것이고 conversion은 어제 금리로 남아 수집 후 테스트가
      # 빨개지고 배포가 막혔다(#467). 그래서 금리 수집 뒤에 한 번 더 돌린다 - API 호출 없이 raw와
      # rates.json을 읽을 뿐이라 몇 초다. 금리 수집이 실패했으면 rates.json이 그대로라 같은 값이
      # 다시 나온다(일관). 이 단계가 실패해도 job을 멈추지 않는다: 멈추면 같은 실행의 수집분
      # 커밋이 안 돌아 데이터가 사라진다(#62). conversion이 낡은 채 남으면 수집 후 테스트가 잡는다.
      - name: 전환율 다시 만들기 (금리 반영)
        if: env.MODE == 'full'
        continue-on-error: true
        run: node scripts/build-conversion.ts

      - name: 기사에 실거래가·금리 수치 붙이기
        run: node scripts/news-context.ts

      # 여섯 렌더 스크립트(prerender·build-rate-pages·build-news-pages·build-budget-pages·build-realestate-pages·build-updated-stamp)는
      # scripts/render-pipeline.ts가 순서대로 돌린다. 하나라도 실패하면 JIPGYE_RENDERER=legacy로 처음부터 다시 렌더해
      # 뒤의 커밋이 돌게 한다(그날 받은 수집분이 사라지지 않게). 폴백이 발동하면 맨 끝 "렌더 폴백 반영" 단계가 job을 실패로 끝낸다(#238).
      - name: 정적 HTML에 오늘 내용 심기
        id: render
        run: node scripts/render-pipeline.ts

      # 커밋이 테스트보다 먼저다.
      #
      # 수집 후 테스트가 깨지면 그날 받은 데이터가 통째로 사라진다 — 국토부·금감원에서
      # 하루치를 다시 받을 방법이 없고, 실제로 수집이 사흘 연속 유실된 적이 있다.
      # 커밋을 먼저 하면 자료는 남고, 아래 테스트가 실패하면 배포는 멈춘 채로 빨갛게
      # 뜬다. 잃는 것(그날 배포가 밀림)이 잃지 않는 것(그날 자료)보다 싸다.
      - name: 변경사항 커밋 및 푸시
        run: |
          if [ "$MODE" = "full" ]; then
            ./scripts/push-docs.sh "chore: 데일리 데이터 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          else
            ./scripts/push-docs.sh "chore: 뉴스 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          fi

      - name: 테스트 (수집 후)
        run: npm test

      - name: Pages 배포
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "./docs"

      - name: Pages에 배포
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

      # 원본 커밋·테스트·배포가 모두 끝난 뒤에야 실패로 끝낸다. 앞 단계가 실패했으면
      # 이 단계는 돌지 않고 job은 이미 실패다.
      - name: 금리 수집 실패 반영
        if: steps.rates.outcome == 'failure'
        run: |
          echo "::error::금리 수집(금감원 finlife)이 실패했다 - 위 '예·적금·대출 금리 수집' 단계의 진단 로그와 docs/data/rates-meta.json의 failCause를 본다. 원본 커밋·배포는 끝났다"
          exit 1

      # 렌더 폴백이 발동한 날의 표시다. 커밋·테스트·배포가 모두 끝난 뒤에야 실패로 끝낸다 -
      # 사이트는 legacy 출력으로 정상 배포됐고, 빨간 job과 실패 메일이 원인 조사를 알린다.
      - name: 렌더 폴백 반영
        if: steps.render.outputs.fallback == 'true'
        run: |
          echo "::error::React 렌더 실패 → legacy로 폴백했음. 사이트는 정상 배포됨, 원인 조사 필요 - 위 '정적 HTML에 오늘 내용 심기' 단계의 1차 시도 로그를 본다"
          exit 1
