name: Daily update

on:
  schedule:
    - cron: "7 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "갱신 범위 (full=전체, news=뉴스만)"
        type: choice
        options: [full, news]
        default: full
      backfill:
        description: "실거래 원본 백필 상한 (비우면 50)"
        type: string
        default: ""

# 수집 워크플로는 저장소에 쓰는 권한 하나만 가진다(#510, 구조 B-4). 렌더·시험·Pages 배포는 deploy.yml 의 일이다 - 수집이 배포 권한(pages·id-token)이나
# 배포 환경(github-pages)을 쥐고 있으면 그 단계가 다시 붙어 수집이 렌더·시험 실패에 묶이는 2026-09-02~10-01 모양으로 돌아간다. 커밋은 docs/data 와 raw 만 한다(push-docs.sh).
permissions:
  contents: write

concurrency:
  group: digest-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '7 23 * * *' && 'full' || 'news') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: npm ci

      - name: 뉴스 수집
        run: node scripts/fetch-news.ts

      - name: 시장 지표 수집
        if: env.MODE == 'full'
        run: |
          node scripts/fetch-market.ts
          node scripts/fetch-price-index.ts
          node scripts/fetch-indicators.ts
          node scripts/fetch-district-index.ts
          node scripts/fetch-move-in.ts
        env:
          # 없으면 공개 sample 키로 돈다. 시크릿을 넣으면 열 건 제한이 풀린다.
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}

      - name: 실거래 수집
        if: env.MODE == 'full'
        run: |
          node scripts/fetch-realestate.ts
          # 받은 원본은 바로 커밋한다. 뒤의 빌더나 다른 수집이 실패해도 그날 원본이
          # 사라지지 않게 - 2026-10-03에 금리 단계 하나가 175슬롯을 버렸다(#62).
          ./scripts/push-docs.sh "chore: 실거래 원본 $(TZ=Asia/Seoul date +%Y-%m-%d)" raw
          node scripts/build-realestate.ts
          node scripts/build-budget-deals.ts
          node scripts/build-conversion.ts
          node scripts/build-cancellation.ts
          node scripts/build-renewal-facts.ts
          node scripts/build-floor-gap.ts
          node scripts/build-outlook.ts
          node scripts/build-indicators.ts
          node scripts/build-move-in.ts
          node scripts/build-complex-price.ts
          node scripts/build-record-high.ts
          node scripts/build-district-change.ts
          node scripts/build-complex-ratio.ts
          node scripts/build-rent-preview.ts
          node scripts/build-search-index.ts
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MOLIT_API_ENDPOINT: ${{ secrets.MOLIT_API_ENDPOINT }}
          MOLIT_RENT_API_KEY: ${{ secrets.MOLIT_RENT_API_KEY }}
          MOLIT_RENT_API_ENDPOINT: ${{ secrets.MOLIT_RENT_API_ENDPOINT }}
          MOLIT_BACKFILL_LIMIT: ${{ inputs.backfill }}

      # 전환율(build-conversion)은 위 "실거래 수집" 안에서 한 번만 만든다. ECOS 금리 계열은 같은 실행의 "시장 지표 수집"(fetch-indicators)이 raw/indicators/series.json 에 먼저 써 두므로
      # 실거래 수집 뒤에 다시 만들 일이 없다(#577 B1b·#607). 금감원 금리 수집은 소유자 결정으로 뺐다(2026-10-25, #577 A). conversion 이 낡은 채 남으면 deploy.yml 의 build/site 시험(sample-size)이 그 배포를 막는다.
      - name: 기사에 실거래가 수치 붙이기
        run: node scripts/news-context.ts

      # 이 워크플로의 마지막 일은 커밋이다(#510, 구조 B-4). 렌더·시험·Pages 배포는 deploy.yml 이 이 워크플로의 완료(workflow_run)와 main 푸시를 받아 따로 한다 -
      # 여기서 렌더하거나 시험을 부르면 수집이 렌더·시험 실패에 다시 묶인다(2026-09-02~10-01, 28일 시계열 유실. 국토부·금감원 응답은 날짜별로 다시 받을 수 없다).
      # 그래서 이 워크플로에는 render-pipeline·npm test·Pages 단계가 없고(test/daily-no-render.test.mjs 가 지킨다), 커밋 경로는 docs/data 와 raw 둘뿐이다(push-docs.sh).
      # 원본(raw)은 위 "실거래 수집" 안에서 이미 따로 먼저 커밋했다(#62). 아래 커밋이 막혀도 그날 원본은 남는다.
      - name: 변경사항 커밋 및 푸시
        run: |
          if [ "$MODE" = "full" ]; then
            ./scripts/push-docs.sh "chore: 데일리 데이터 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          else
            ./scripts/push-docs.sh "chore: 뉴스 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          fi
