# 정기 실행 누락 탐지 (#322). `daily-update` 의 `schedule` 실행이 **통째로 빠져도** 아무도 모르던 자리를 막는다.
# (#530 으로 Deploy site 의 마지막 성공을 보는 셋째 검사, #657 로 데이터 진척을 보는 넷째 검사와 경고를 이슈로 올리는 report job 이 붙었다. 아래 서술은 첫 검사 것이다.)
# 재는 것 하나: **지난 36시간(미끄러지는 창) 안에 `daily-update` 의 schedule run 이 cron 수만큼 떴는가.**
# 모자라면 이 워크플로가 실패로 끝난다 - 빨간 run 과 GitHub 의 실패 알림이 저장소 안에서 우는 자리다(새 서비스·계정·비용 0, #322 범위 3).
#
# 문턱 둘과 근거 (#322 완료 조건 1):
#   - ⚠️ **#506 뒤의 창은 36시간이다(scripts/check-schedule-runs.ts 의 `MISSING_CHECK_WINDOW_HOURS`, cto 판정 2026-10-23: 36h).**
#     근거 (2026-10-23 daily-update schedule run 287건 실측: 지연 중앙 2.1h·최대 7.8h, 연속 run 간격 21.1~28.9h; 23:07 칸만 남긴 10-05~10-23 재생에서 창 24h 는 25점 거짓 경보, 28~40h 는 0).
#     daily-update 의 cron 이 `7 23 * * *` 하나로 줄어 정상 최대 간격 24h 에 정상 지연 7h 를 더하면 31h 라, 28h 로는 지연 하나에
#     운다. 아래 28시간 서술과 수치는 cron 넷이던 때의 실측이다(옛 근거로 남긴다).
#   - **창 28시간** - 고정 날짜가 아니라 미끄러지는 창이다. 날짜로 세면 23:07 분이 자정을 넘겨 밀릴 때 한 번 적게 세어진다.
#     ⚠️ 처방은 24시간이었다. 실제 이력(10-05~10-13, 10분 간격 1,296 시점)에 24h 로 돌리면 **118 시점이 운다** -
#     cpo 가 「남는 거짓 경보 자리」로 미리 적어 둔 자리(지연이 커지면 어제 성공이 창 밖으로 밀린다)가 실재했다.
#     그래서 **미리 승인된 길 ⓐ(창 26~28h)** 를 쓴다. 같은 이력에서 25h→55 · 26h→30 · 27h→9 · **28h→0** 이다.
#     28h 로도 2026-08-26 의 실제 누락은 그대로 잡는다(08-27 에 83 시점 울음, 최저 2).
#   - **횟수 = cron 수** - 상수가 아니다. scripts/check-schedule-runs.ts 가 daily-update.yml 의 `on.schedule` 아래
#     `- cron:` 줄을 세어 쓴다(**자동 연동**). cron 을 하나 더하면 문턱도 그날부터 5가 된다. 블록을 못 찾으면 4로
#     되돌아가지 않고 종료 코드 2로 죽는다 - 조용히 느슨해지는 것이 이 이슈가 막으려는 모양이다.
#     (수동 쪽 표식도 하나 둔다: test/schedule-watchdog.test.mjs 가 "지금 cron 은 1개"를 못박아, cron 을 고치면
#      `npm test` 가 그 사실을 소리나게 알린다. 장치 자체는 시험을 안 기다리고 바로 따라간다.)
#
# **왜 여기인가, 그리고 이 자리의 한계** (#322 완료 조건 4 - 이 이슈의 핵심 함정):
#   - `daily-update` 안에 두면 안 된다 - **그 실행이 안 뜨는 것이 재려는 사건**이라 탐지기도 같이 안 뜬다.
#   - `summarize.yml` 도 안 된다 - `workflow_run: [Daily update]` 로 매달려 있어 같은 눈먼 자리를 공유한다.
#   - `test.yml` 도 안 된다 - push·PR 에만 돌아 무인 경로가 아니고, 수집 데이터·오늘 날짜에 따라 결과가 갈리는
#     검사는 `npm test` 에 넣지 않는다(#8 에서 데인 자리).
#   - 그래서 **별도 워크플로 + 자기 cron 둘**이다. 두 틱은 12시간 간격이라, 한 틱이 버려져도 다음 틱의 28시간
#     창이 같은 구간을 다시 덮는다.
#   - ⚠️ **한계: 이 cron 도 GitHub 이 버릴 수 있다. 완전 자가면역은 없다**(#322 cpo 참고 메모). 둘 다 같은 날
#     버려지면 그날은 눈이 없다. 줄이는 것까지가 여기서 할 수 있는 전부고, 없애지는 못한다.
#
# 무엇을 세는가 - **축을 적는다**: run 의 `created_at`(cron 틱이 run 을 만든 시각. 이 저장소 255건에서 `run_started_at` 과 같다),
# 창은 `(now-28h, now]`, 집합은 **발화**(창 안 schedule run 전부, 결론 무관)다. 성공 수도 늘 같이 출력하되 판정에는 안 쓴다 -
# `success` 로 판정하면 실제 이력 1,296 시점 중 **336 시점**이 울고(61일로 넓히면 8,784 중 5,235), 그 날들은 실행이 빠진 날이
# 아니라 **실행이 실패한 날**이다. 실패는 이미 빨간 run 과 실패 메일로 운다 - 조용한 누락을 잡는 장치가 시끄러운 것을 다시
# 울리면 #322 「비용」 절이 적은 대로 아무도 안 보게 된다. 판정 기준을 바꾸려면 `--count=success` 한 줄이다.
#
# cron 시각은 daily-update(23:07 UTC)·official-price-api(14:17)·correction-release(매월 12일 17:43)와
# 겹치지 않게 05:29·17:29 UTC(14:29·02:29 KST)로 둔다. 커밋·푸시가 없어 digest-pipeline 그룹을 공유하지 않는다.
name: Schedule watchdog

on:
  schedule:
    - cron: "29 5 * * *"
    - cron: "29 17 * * *"
  workflow_dispatch:
    inputs:
      # 시험 표지(#657 완료 조건 12): 판정과 무관하게 표지 이슈 한 건으로 쓰기 경로를 잰다. 자유 문자열을 안 받고, 정기 실행에서는 비어 있다.
      issue_test:
        description: "이슈 쓰기 경로 시험"
        type: choice
        options:
          - none
          - dispatch-test
        default: none

# 기본은 읽기만 한다. 다른 워크플로의 run 목록을 보려면 actions: read 가 필요하다. 쓰기 권한은 아래 report job 에만 있다(#657 D2).
permissions:
  contents: read
  actions: read

concurrency:
  group: schedule-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # 넷째 검사의 판정(ok 가 아닌 소스, JSON 한 줄). 스텝이 돌지 못하면 비고, report 가 그것을 실패로 친다.
      progress_report: ${{ steps.progress.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # `npm ci` 가 없는 이유: 이 스크립트는 의존이 0이다(Node 24 의 전역 fetch 만 쓴다).
      # 탐지기가 설치 단계에서 깨지면 누락을 못 보므로, 지나는 단계를 일부러 적게 둔다.
      - name: 지난 36시간의 daily-update 정기 실행 수를 센다
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-schedule-runs.ts
      # 둘째 검사 (#499, #449 의 449-B): 「뜨지만 매번 실패」. 위 검사는 떴는지만 보므로 매번 실패하는 run 은 통과한다.
      # 지난 54시간(scripts/check-schedule-runs.ts 의 `SUCCESS_CHECK_WINDOW_HOURS`, cto 판정 2026-10-23)의 schedule run 중
      # 성공이 0이면 이 스텝이 실패한다 - 알림 경로는 위와 같다(워치독 run 이 빨개지고 GitHub 의 실패 알림이 소유자에게 간다. 새 서비스·비용 0).
      # `!cancelled()` 인 이유: 위 스텝이 실패해도 이 스텝이 돌아야 두 경보가 서로를 가리지 않는다.
      # 허용된 잔여 위험: 수집이 전면 실패해도 경보는 마지막 성공 뒤 약 58~71h 에야 온다(단발 실패는 빨간 run, 누락은 위 스텝이 맡는다).
      - name: 지난 54시간에 daily-update 정기 실행 성공이 있는지 본다
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-schedule-runs.ts --check=success
      # 셋째 검사 (#530, 부모 #505): 「배포가 조용히 멈춤」. B4 뒤 사이트는 deploy.yml(워크플로 이름 Deploy site)이 게시한다 - 그것이 멈춰도 Daily 는 초록이라 위 두 검사로는 못 잡는다.
      # 지난 54시간(scripts/check-schedule-runs.ts 의 `DEPLOY_CHECK_WINDOW_HOURS`)의 push·workflow_run 실행 중 성공이 0이면 이 스텝이 실패한다(workflow_dispatch 는 롤백 전용이라 안 센다).
      # 취소된 실행은 성공도 실패도 아니다 - 창 안에 성공이 하나라도 있으면 조용하다. 알림 경로는 위와 같다. `!cancelled()` 인 이유도 같다.
      # 허용된 잔여 위험: 배포가 완전히 멈춰도 경보는 마지막 성공 뒤 약 54~66h 에야 온다(워치독 틱 간격 12h).
      # 같은 스텝의 둘째 규칙 (#822): Deploy site run 이 성공 없이 2회 이어서 실패하면 54시간을 기다리지 않고 실패한다. 뜻과 재생 결과는 그 스크립트 머리 주석. 권한은 그대로 읽기 둘이다.
      - name: Deploy site 가 54시간 안에 성공했고 연속 2회 실패가 아닌지 본다
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-schedule-runs.ts --check=deploy
      # 넷째 검사 (#657 V11): 「run 은 초록, 진척은 0」. 위 셋은 실행을 보고, 이것은 체크아웃한 main 의 데이터를 본다(수집기는 못 받으면 어제 값으로 간다).
      # 소스마다 주기(하루·영업일·월·반기·수동 월간)에 맞춘 문턱 - 확인 단계는 ::warning:: 만(run 초록), 알림 단계를 넘은 소스가 있으면 실패한다. 문턱과 근거는 그 스크립트 머리 주석.
      # API·토큰이 필요 없다(파일만 읽는다). `!cancelled()` 인 이유는 위와 같다. 같은 스크립트가 빌더 산출물 나이(F2: updatedAt 30h 경고·54h 실패)도 본다.
      - name: 데이터가 소스 주기대로 앞으로 나가는지 본다
        id: progress
        if: ${{ !cancelled() }}
        run: node scripts/check-data-progress.ts

  # 경고의 출구 (#657 D1·D2): `::warning::` 은 run 이 초록이고 메일도 없다. watch 의 판정으로 묶음당 이슈 1건을 연다(틱당 새 이슈 3건 상한, 자동 닫기·댓글 없음). 규칙은 그 스크립트 머리 주석.
  # `!cancelled()` 인 이유: watch 가 실패해도 경고는 이슈로 올라가야 한다. watch 의 결과가 비었거나 못 읽으면 조용히 넘어가지 않고 이 job 이 실패한다.
  # job 권한이 최상위를 대신한다: issues 쓰기와 스크립트 체크아웃용 contents 읽기뿐이다(actions 없음). 새 시크릿·cron·외부 호출 없음, npm ci 없음(의존 0).
  # 체크아웃에 토큰을 남기지 않는다(persist-credentials: false). 표지 입력은 run 에 끼워 넣지 않고 env 로 넘긴다.
  report:
    needs: watch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: 데이터 진척 경고를 이슈로 올린다
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROGRESS_REPORT: ${{ needs.watch.outputs.progress_report }}
          ISSUE_TEST: ${{ inputs.issue_test }}
        run: node scripts/report-data-progress.ts
