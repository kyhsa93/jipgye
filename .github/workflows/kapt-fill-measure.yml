# K-apt 채움률 측정 (#823). 초안이다. clo 대조 뒤 메인 세션이 .github/workflows/ 로 옮긴다.
# 사람이 dispatch 로 한 번만 돌린다. cron 없음. 저장소에 쓰지 않는다(contents: read, 커밋·푸시 스텝 없음, 출력은 $RUNNER_TEMP 아래).
# 호출 상한은 스크립트가 서비스별로 지킨다(15057332 60회, 15058453 4,800회). 인증 오류는 다시 시도하지 않고 멈춘다.
# 시크릿은 호출 스텝 env 에만 둔다. PUBLIC_DATA_PORTAL_API_KEY 하나뿐이고 다른 키로 넘어가지 않는다.
# 조기 중단(인증 오류 등으로 상세 확인 전에 멈춤)은 아티팩트 이름이 달라, 원인을 고친 뒤 resume_after_early_stop=yes 로 두 번까지 다시 돌릴 수 있다.
name: K-apt fill measure

on:
  workflow_dispatch:
    inputs:
      clo_comment:
        description: "clo 약관 대조 기록 댓글 주소 (이슈 #823)"
        type: string
        required: true
      resume_after_early_stop:
        description: "조기 중단의 원인을 고친 뒤 다시 돌릴 때만 yes"
        type: choice
        options: ["no", "yes"]
        default: "no"

# actions: read 는 「재실행 거부」가 아티팩트 목록을 읽는 데만 쓴다.
permissions:
  contents: read
  actions: read

concurrency:
  group: kapt-fill-measure
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: 입력 확인
        env:
          CLO_COMMENT: ${{ inputs.clo_comment }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "main 에서만 돌린다(받은 ref: $GITHUB_REF)" >&2; exit 1; }
          [[ "$CLO_COMMENT" =~ ^https://github\.com/kyhsa93/jipgye/issues/823#issuecomment-[0-9]+$ ]] || { echo "clo_comment 는 이슈 #823 댓글 주소여야 한다" >&2; exit 1; }
          echo "clo 기록: $CLO_COMMENT" >> "$GITHUB_STEP_SUMMARY"

      # 어느 하나라도 확인하지 못하면 호출하지 않는다.
      - name: 재실행 거부
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME: ${{ inputs.resume_after_early_stop }}
        run: |
          done_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=kapt-fill" --jq .total_count)"
          early_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=kapt-fill-early-stop" --jq .total_count)"
          node research/kapt-fill-2026-11/measure.mjs guard --attempt "$GITHUB_RUN_ATTEMPT" --done "$done_count" --early-stops "$early_count" --resume "$RESUME"

      - name: 측정 (호출 상한 60 + 4800)
        env:
          PUBLIC_DATA_PORTAL_API_KEY: ${{ secrets.PUBLIC_DATA_PORTAL_API_KEY }}
        run: |
          set -o pipefail
          node research/kapt-fill-2026-11/measure.mjs fetch --out "$RUNNER_TEMP/kapt-fill" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 쓰기 0 확인
        if: ${{ !cancelled() }}
        run: |
          test -z "$(git status --porcelain)" || { git status --porcelain >&2; echo "작업 트리가 바뀌었다" >&2; exit 1; }

      # 스크립트가 이름을 남기지 못하고 죽었으면 막는 쪽 이름을 쓴다.
      - name: 아티팩트 이름
        id: artifact
        if: ${{ !cancelled() }}
        run: |
          name="$(cat "$RUNNER_TEMP/kapt-fill/artifact-name" 2>/dev/null || true)"
          test "$name" = "kapt-fill-early-stop" || name="kapt-fill"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # 요약뿐이다. 단지별 행은 스크립트가 쓰지 않는다.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/kapt-fill
          retention-days: 30
          if-no-files-found: ignore

      # 취소·시간 초과면 끝의 비밀값 검사를 못 지났으므로 시작 표시만 남긴다. 그래도 다음 dispatch는 막힌다.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ cancelled() }}
        with:
          name: kapt-fill
          path: ${{ runner.temp }}/kapt-fill/fetch-started.json
          retention-days: 30
          if-no-files-found: ignore
