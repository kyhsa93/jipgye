name: Summarize

on:
  workflow_run:
    workflows: ["Daily update"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "판정을 무시하고 무조건 요약"
        type: boolean
        default: false

# 수집·요약 워크플로는 저장소에 쓰는 권한 하나만 가진다(#510, 구조 B-4). 렌더·시험·Pages 배포는 deploy.yml 의 일이다(daily-update.yml 과 같은 이유).
permissions:
  contents: write

concurrency:
  group: digest-pipeline
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - id: decide
        run: node scripts/summary-needed.ts

  summarize:
    needs: check
    if: needs.check.outputs.needed == 'true' || inputs.force
    runs-on: ubuntu-latest
    env:
      OLLAMA_MODEL: qwen3:14b
      OLLAMA_THINK: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: npm ci

      - name: 왜 돌리는지 남긴다
        run: echo "${{ needs.check.outputs.reason || '수동 실행(force)' }}"

      - name: Ollama 설치 및 모델 준비
        env:
          OLLAMA_VERSION: v0.32.6
          OLLAMA_SHA256: dec2fa50d24e6868ca3c4c977d69d059399372105f951a9acc320a5a79aadcfc
        run: |
          command -v zstd >/dev/null || (sudo apt-get update -y && sudo apt-get install -y zstd)
          curl -fsSL -o ollama.tar.zst \
            "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_SHA256}  ollama.tar.zst" | sha256sum -c -
          zstd -d ollama.tar.zst -o ollama.tar
          sudo tar -xf ollama.tar -C /usr/local
          rm -f ollama.tar.zst ollama.tar

          ollama serve &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/version > /dev/null && break
            sleep 1
          done
          ollama pull "$OLLAMA_MODEL"

      - name: AI 요약 생성
        run: node scripts/summarize-news.ts

      - name: 뉴스 제목 영어 번역
        run: node scripts/translate-news.ts

      # news-context 는 렌더러와 무관한 데이터 가공이라 이 워크플로에 남는다(docs/data 만 쓴다).
      - name: 기사에 실거래가·금리 수치 붙이기
        run: node scripts/news-context.ts

      # 마지막 일은 커밋이다(#510, 구조 B-4). 렌더·시험·Pages 배포는 deploy.yml 이 이 워크플로의 완료(workflow_run)를 받아 따로 한다 - 여기서 렌더하거나 시험을
      # 부르면 요약 커밋이 렌더·시험 실패에 묶인다(전에는 이 워크플로의 시험이 커밋 앞에 있어 요약이 시험 하나에 막혔다). 그래서 render-pipeline·npm test·Pages 단계가 없다
      # (test/daily-no-render.test.mjs 가 지킨다). 전에는 여기 렌더가 「일부러 다섯」 단계(rate 4장 제외)였다 - 커밋된 docs/ 에 rate 4장이 있어서만 성립하던 모양이라,
      # 생성 HTML 을 main 에서 걷어낸 지금은 deploy.yml 이 항상 다섯 단계 전부를 한 번에 그린다.
      - name: 변경사항 커밋 및 푸시
        run: |
          ./scripts/push-docs.sh "chore: AI 요약 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
