name: Summarize

on:
  workflow_run:
    workflows: ["Daily update"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "판정을 무시하고 무조건 요약"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest-pipeline
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - id: decide
        run: node scripts/summary-needed.ts

  summarize:
    needs: check
    if: needs.check.outputs.needed == 'true' || inputs.force
    runs-on: ubuntu-latest
    env:
      OLLAMA_MODEL: qwen3:14b
      OLLAMA_THINK: "false"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: npm ci

      - name: 왜 돌리는지 남긴다
        run: echo "${{ needs.check.outputs.reason || '수동 실행(force)' }}"

      - name: Ollama 설치 및 모델 준비
        env:
          OLLAMA_VERSION: v0.32.6
          OLLAMA_SHA256: dec2fa50d24e6868ca3c4c977d69d059399372105f951a9acc320a5a79aadcfc
        run: |
          command -v zstd >/dev/null || (sudo apt-get update -y && sudo apt-get install -y zstd)
          curl -fsSL -o ollama.tar.zst \
            "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_SHA256}  ollama.tar.zst" | sha256sum -c -
          zstd -d ollama.tar.zst -o ollama.tar
          sudo tar -xf ollama.tar -C /usr/local
          rm -f ollama.tar.zst ollama.tar

          ollama serve &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/version > /dev/null && break
            sleep 1
          done
          ollama pull "$OLLAMA_MODEL"

      - name: AI 요약 생성
        run: node scripts/summarize-news.ts

      - name: 뉴스 제목 영어 번역
        run: node scripts/translate-news.ts

      # news-context는 렌더러와 무관한 데이터 가공이라 폴백 밖에 둔다. 렌더 스크립트는 daily-update.yml과 같은
      # scripts/render-pipeline.ts가 돌리고, 실패하면 JIPGYE_RENDERER=legacy로 처음부터 다시 렌더한다(#238).
      # 단계 목록은 일부러 다섯이다: 금리를 수집하지 않는 이 워크플로는 전에도 build-rate-pages를 안 불렀다(기본 여섯과 다르다).
      - name: 정적 HTML에 오늘 내용 심기
        id: render
        run: |
          node scripts/news-context.ts
          node scripts/render-pipeline.ts \
            scripts/prerender.mjs \
            scripts/build-news-pages.ts \
            scripts/build-budget-pages.ts \
            scripts/build-realestate-pages.ts \
            scripts/build-updated-stamp.ts

      - name: 테스트
        run: npm test

      - name: 변경사항 커밋 및 푸시
        run: |
          ./scripts/push-docs.sh "chore: AI 요약 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"

      - name: Pages 배포
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "./docs"

      - name: Pages에 배포
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

      # 렌더 폴백이 발동한 날의 표시다(daily-update.yml과 같은 단계). 커밋·테스트·배포가 모두 끝난 뒤에야 실패로 끝낸다.
      - name: 렌더 폴백 반영
        if: steps.render.outputs.fallback == 'true'
        run: |
          echo "::error::React 렌더 실패 → legacy로 폴백했음. 사이트는 정상 배포됨, 원인 조사 필요 - 위 '정적 HTML에 오늘 내용 심기' 단계의 1차 시도 로그를 본다"
          exit 1
