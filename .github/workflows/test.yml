name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      # 워크플로 YAML을 실제 파서로 읽는다(문법 오류·중복 키). #118처럼 문법이 깨지면 main push마다 0초 실패 run이 생긴다.
      - run: ruby scripts/check-workflow-yaml.rb
      # 표현식·컨텍스트 오류(#142): 위 검사는 YAML 문법만 보므로 잡 env의 `${{ runner.temp }}`
      # (PR #139, `context "runner" is not allowed here`)를 통과시켰다. actionlint가 잡는다.
      # 외부 바이너리이므로 버전과 SHA-256을 고정하고 `sha256sum -c`로 대조한다(불일치면 이 스텝이 실패).
      # 해시 출처: https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_checksums.txt
      # (linux_amd64 줄, 2026-10-10 확인). 버전을 올리면 해시도 같은 파일에서 다시 가져온다.
      # 셸 린트(shellcheck)도 켠다(#162): run 블록의 SC 지적은 고치거나, 의도면 `# shellcheck disable=` 사유 주석으로 남겼다.
      - name: actionlint v1.7.7
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint"
      # 스타일시트 신선도(#276): docs/style.css는 src/css/를 Tailwind 단독 실행 파일로 빌드해 커밋한 산출물이다.
      # 스크립트가 고정 버전(v4.3.3)을 내려받아 SHA-256 표와 대조한 뒤에만 실행하고, 다시 빌드한 것을 커밋된 파일과 바이트로 견준다.
      # 내려받기 실패·해시 불일치·산출물 불일치는 모두 이 스텝의 실패다. 바이너리는 작업 폴더 밖($RUNNER_TEMP)에 받는다.
      # 버전·해시는 scripts/build-css.mjs의 표 한 곳에만 적는다 - 여기에 다시 적으면 한쪽만 고쳐진다(test/css-build.test.mjs가 본다).
      # 해시 출처는 그 스크립트 머리 주석에 있다(릴리스의 sha256sums.txt와 GitHub API digest, 2026-10-12 확인).
      - name: 스타일시트 신선도 - Tailwind 고정 바이너리로 다시 빌드해 대조
        env:
          TAILWIND_CACHE_DIR: ${{ runner.temp }}/tailwindcss
        run: node scripts/build-css.mjs --check
      - run: npm ci
      # 사이트 생성(#510, 구조 B-4): 생성 HTML 53장은 main 에 없다. 시험은 build/site 를 읽고(test/helpers/site-root.mjs), 그 폴더는 render-pipeline 이 main 의 코드+데이터로 만든다.
      # `npm test` 는 pretest 로 같은 렌더를 한 번 더 하지만(로컬에서도 그냥 `npm test` 가 돌게), 렌더 폴백(React 렌더 실패 -> legacy)은 pretest 에서 조용히 지나간다 - 여기서 막는다.
      # deploy.yml 의 배포 게이트와 같은 규칙이다: 폴백한 산출물은 PR 에서도 병합 후에도 통과시키지 않는다.
      - name: 사이트 생성 (build/site)
        id: render
        run: node scripts/render-pipeline.ts --out=build/site
      - name: 렌더 폴백이면 실패
        if: ${{ steps.render.outputs.fallback == 'true' }}
        run: |
          echo "::error::React 렌더 실패 → legacy 로 폴백했다 - 위 '사이트 생성 (build/site)' 단계의 1차 시도 로그를 본다. 병합되면 deploy.yml 이 같은 이유로 배포를 막는다"
          exit 1
      # 시험 개수 래칫(#315). `npm test`만으로는 두 구멍이 안 막힌다 —
      # (1) 따옴표 없는 글롭은 셸이 먼저 펼쳐, 안 맞는 파일이 Node에 **인자로 전달조차 되지 않는다**
      #     (package.json에서 따옴표로 묶어 Node가 펼치게 바꿨다. bash는 `{mjs,ts}`를 펼치고 dash는 안 펼쳐
      #     따옴표가 없으면 동작이 셸에 묶인다 — CI ubuntu의 sh는 dash다),
      # (2) 글롭이 **하나도 안 맞아도 `node --test`의 종료 코드가 0**이다(pm 재현 2026-10-14, Node v24.16.0).
      # 그래서 실제로 돈 개수를 커밋된 하한(test/COUNT)과 대조한다. tee로 로그를 남기고 pipefail로
      # `npm test` 자체의 실패도 그대로 떨어뜨린다.
      - name: npm test + 시험 개수 래칫
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/root-test.log"
          node scripts/test-count-ratchet.mjs test/COUNT "$RUNNER_TEMP/root-test.log"
      # 배포 게이트와 같은 명령(#510). 위 `npm test` 가 build/site 기준 시험을 전부 포함하지만, 게이트는 그 부분집합을 따로 세는 하한(test/COUNT-site)으로 돈다 -
      # 시험 파일이 build/site 를 안 읽게 바뀌거나 지워져 게이트가 비는 PR 이 여기서 빨개진다(병합 후 데이터 배포 날에야 드러나지 않게). 위 pretest 가 방금 만든 build/site 를 읽는다.
      - name: 배포 게이트 시험 (build/site 기준)
        run: npm run test:site
      # 데이터 건강 점검(#507): 커밋된 데이터와 그 생성물이 맞는지 보는 검사(tools/health)다. 루트 `npm test`에서 뺐다 - 데이터가
      # 하루에 한 번 바뀌는 구조에서 기능 PR 시험이 그날 데이터에 기대면 안 된다. 여기서는 **비차단**(continue-on-error)이라
      # 실패해도 이 job 과 Test+Deploy 판정은 초록이고, 단계 실패 표시와 로그로만 알린다. 데이터가 바뀌는 날의 빨간 run 은
      # daily-update.yml·summarize.yml 의 맨 끝 "데이터 건강 점검 실패 반영" 단계가 맡는다.
      - name: 데이터 건강 점검 (비차단)
        continue-on-error: true
        run: npm run health
      # tools/golden(#236·#274)은 의존 트리를 루트와 나눠 놨다(parse5) — 루트 `npm ci`로는 설치되지 않아
      # 이 폴더 시험이 CI 밖에 있었다. 그래서 `docs/*.js`의 class 문자열을 바꾸고 훅 목록(`hook-classes.json`)을
      # 안 고친 PR은 누군가 손으로 `tools/golden`에서 `npm test`를 돌릴 때에야 드러났다(#289 본문).
      # 넣는 것은 고정 fixture만 읽는 `npm test`(단위·변이·훅 목록 어긋남)뿐이다 — 수집한 데이터도 오늘 날짜도
      # 읽지 않으므로 "데이터·날짜에 따라 결과가 갈리는 검사는 넣지 않는다"(#8에서 데인 자리)에 걸리지 않는다.
      # 101개 중 90통과·11건너뜀(건너뛴 11은 GOLDEN_LIVE 게이트), 이 기기 6.6초.
      # `--render` 비교와 `npm run test:live`는 넣지 않는다(#289 cto 판정): merge-base를 받아 두 번 렌더해야 하고,
      # 의도한 차이는 예외 목록과 po·cmo 확인으로 PR 본문에서 가리는 절차다. R-UI′ 4번의 PR 증빙으로 둔다.
      # 캐시 설정은 건드리지 않는다 — `npm ci`가 쓰는 것은 전역 npm 캐시(`~/.npm`)이고 위 setup-node가 이미 복원해 둔다.
      - name: tools/golden npm ci
        run: npm ci
        working-directory: tools/golden
      # 래칫은 루트와 같은 모양이되 하한은 따로 둔다(#315 완료 조건 3) — 의존 트리가 다르고(parse5)
      # 건너뛰는 11개(GOLDEN_LIVE 게이트)까지 합쳐 `ℹ tests`가 101이라 루트 숫자와 섞으면 안 된다.
      - name: tools/golden npm test + 시험 개수 래칫
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/golden-test.log"
          node ../../scripts/test-count-ratchet.mjs test/COUNT "$RUNNER_TEMP/golden-test.log"
        working-directory: tools/golden
      # 타입 검사(#316 G-TS 1단계 #421, 1b단계 #423이 tools/render의 .ts 11개를, 2단계 #425가 scripts/의 .ts 59개를 같은 스텝에 더했다). `.ts`를 실행하는 것은 위 `npm test`(Node 24 타입 스트리핑)이고, 아래 스텝은 `tsc --noEmit`으로 **검사만** 한다 -
      # 산출물이 없다(tools/typescript/tsconfig.json의 noEmit. 루트 test/typescript-gate.test.mjs가 지킨다). 의존(typescript·@types/node, 정확 버전)은
      # 루트·tools/golden과 나눠 tools/typescript에만 있다. 플래그는 그 폴더의 tsconfig.json 한 파일에 전부 적혀 있고 명령줄에는 얹지 않는다(`strict`는 끈 채다).
      # 순서가 뜻을 갖는다: `tools/golden npm ci` **뒤**여야 한다 - 앞에 두면 `parse5`를 못 찾아 TS2307이 오류 수에 섞인다.
      # 이 스텝이 무는지는 #421의 대조군 커밋(시험이 안 부르는 tools/golden/bin/bench.ts를 일부러 깬 것)의 run으로 본다.
      - name: tools/typescript npm ci
        run: npm ci
        working-directory: tools/typescript
      - name: tsc --noEmit (tools/golden·tools/render·scripts의 .ts)
        run: npx tsc -p tsconfig.json
        working-directory: tools/typescript

  # 렌더 기반 접근성 검사(#325 = #278 PR A). **별도 잡이다 — 위 `test`와 병렬로 돈다.**
  # 왜 별도 잡인가(cto 판정 2026-10-15, #325 `6182990669`):
  #   - 위 잡은 `jobs.test` 하나에 스텝이 직렬이라, 스텝으로 붙이면 3초가 아니라 체크아웃·`npm ci`까지
  #     그대로 더해진다. 별도 잡이면 병렬이라 벽시계가 사실상 안 는다.
  #   - Chrome이 흔들리는 날 **빠른 게이트를 같이 끌고 내려가지 않는다.**
  # Chrome 설치 스텝이 없는 이유: 이 저장소의 `ubuntu-latest`는 ubuntu-24.04이고 그 이미지에
  # Google Chrome·Chromium·ChromeDriver가 들어 있다(actions/runner-images Ubuntu2404-Readme.md).
  # `tools/render/lib/chrome.ts`의 후보 경로에 `/usr/bin/google-chrome`·`-stable`·`/usr/bin/chromium`이 이미 있다.
  # ⚠️ **못 찾으면 건너뛰지 않고 죽는다**(#274 체인 공통 규칙 1번) — 건너뛴 시험은 `pass` 하한에 0을
  # 보태므로, env 게이트를 달면 "브라우저가 없어서 안 돌았다"가 초록으로 끝난다.
  # 넣는 것은 **고정 fixture만 읽는 `npm test`**(변이 열하나 + 대조군 넷 + 단위)뿐이다. 실제 `docs/`를 읽는
  # 전수 위반 목록·양성 대조는 **입력이 매일 바뀌므로** CI가 아니라 PR 증빙이다(#8 재발 방지 R3,
  # `tools/golden`의 `test` ↔ `test:live`와 같은 선).
  # `npm ci`가 아니라 `npm test`만 부르는 이유: 이 폴더는 **의존이 0**이라 `package-lock.json`이 없고,
  # 락파일 없는 폴더에서 `npm ci`는 실패한다. 의존이 생기면 락파일과 함께 `npm ci`를 되살린다(#325 결정 1).
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # 러너의 Chrome을 **이름과 버전으로 로그에 남긴다.** 아래 시험이 어차피 Chrome 없으면 실패하지만,
      # 그때 로그에는 "Chrome을 찾지 못했습니다"만 남아 러너 이미지가 바뀐 것인지 알 수 없다.
      - name: 러너의 Chrome을 찾아 버전을 적는다
        run: |
          set -euo pipefail
          chrome=$(node -e 'import("./tools/render/lib/chrome.ts").then((m) => { const p = m.findChrome(); if (!p) { console.error("Chrome을 못 찾았다 - 러너 이미지가 바뀌었는지 본다."); process.exit(1); } process.stdout.write(p); });')
          echo "Chrome: $chrome"
          "$chrome" --version
      # 래칫은 루트·tools/golden과 같은 모양이되 하한은 따로 둔다 — 이 폴더에는 정당한 skip이 없어
      # 두 수(tests·pass)가 같다(tools/render/test/COUNT 주석).
      - name: tools/render npm test + 시험 개수 래칫
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/render-test.log"
          node ../../scripts/test-count-ratchet.mjs test/COUNT "$RUNNER_TEMP/render-test.log"
        working-directory: tools/render
