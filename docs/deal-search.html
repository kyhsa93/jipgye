const EOK = 10000;

const MAX_ROWS = 30;

const ALL = "all";

const BAND_MIN = 3 * EOK;
const BAND_MAX = 30 * EOK;

function bandStartOf(amount10k) {
  if (typeof amount10k !== "number" || !Number.isFinite(amount10k) || amount10k <= 0) return null;
  if (amount10k < BAND_MIN) return 0;
  if (amount10k >= BAND_MAX) return BAND_MAX;
  return Math.floor(amount10k / EOK) * EOK;
}

const AREA_BUCKETS = [
  { key: "60", min: null, max: 60 },
  { key: "60-85", min: 60, max: 85 },
  { key: "85-135", min: 85, max: 135 },
  { key: "135", min: 135, max: null },
];

const DEPOSIT_BUCKETS = [
  { key: "1", min: null, max: 1 * EOK },
  { key: "1-3", min: 1 * EOK, max: 3 * EOK },
  { key: "3-5", min: 3 * EOK, max: 5 * EOK },
  { key: "5-7", min: 5 * EOK, max: 7 * EOK },
  { key: "7-10", min: 7 * EOK, max: 10 * EOK },
  { key: "10", min: 10 * EOK, max: null },
];

const RENT_BUCKETS = [
  { key: "50", min: null, max: 50 },
  { key: "50-100", min: 50, max: 100 },
  { key: "100-200", min: 100, max: 200 },
  { key: "200", min: 200, max: null },
];

const KINDS = ["sale", "jeonse", "wolse"];

const AGE_BUCKETS = [
  { key: "5", within: 5 },
  { key: "10", within: 10 },
  { key: "20", within: 20 },
  { key: "30", over: 30 },
];

const squash = (text) => String(text ?? "").replace(/\s+/g, "").toLowerCase();

let locale = (() => {
  const saved = window.localStorage.getItem("lang");
  return saved === "en" || saved === "ko" ? saved : "ko";
})();
const t = (key) => T[locale][key];

const THEME_ICONS = { auto: "🌓", light: "☀️", dark: "🌙" };
let theme = (() => {
  const saved = window.localStorage.getItem("theme");
  return saved === "light" || saved === "dark" ? saved : "auto";
})();
function applyTheme(next) {
  theme = next;
  window.localStorage.setItem("theme", theme);
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  document.querySelector("#theme-toggle span").textContent = THEME_ICONS[theme];
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function setText(id, text) {
  const el = document.getElementById(id);
  if (el) el.textContent = text;
}

const cache = { budget: null, search: null };

const fullDeals = new Map();
const fullRents = new Map();
// 최근 두 달 거래(deals-*)·전월세(rents-*) 목록을 받다가 실패한 구. 키를 fullDeals/fullRents에 남기지 않는 것은
// 그대로다(키가 없어야 다음 refresh가 다시 받는다). 다만 그러면 "받는 중"·"파일 없음"과 실패가 구분되지 않아
// 단지 카드와 결과가 조용히 빠졌다(#196). 404(null)는 실패가 아니라 fullDeals/fullRents의 null이 그대로 말한다.
const dealsFailed = new Set();
const rentsFailed = new Set();
// 단지·평형별 매매가 범위(scripts/build-complex-price.mjs). 계산은 빌드가 끝냈고 여기서는 그리기만 한다.
// 구 이름 -> 단지 가격 파일. 값이 셋 중 하나다: 파일 객체(받음), null(파일이 아직 없음 - 404),
// COMPLEX_FAILED(받다가 실패). 키가 없으면 아직 받는 중이다. 실패를 "받는 중"과 같은 상태(키 없음)로
// 두면 "찾는 중..."이 영구히 남는다(#174).
const complexPrices = new Map();
const COMPLEX_FAILED = Object.freeze({ failed: true });
const complexFailed = (name) => complexPrices.get(name) === COMPLEX_FAILED;
// 이미 받았고 쓸 수 있는가. 실패는 받은 것이 아니라서 다음 refresh가 다시 받는다.
const complexLoaded = (name) => complexPrices.has(name) && !complexFailed(name);

const params = new URLSearchParams(location.search);
let kind = KINDS.includes(params.get("kind")) ? params.get("kind") : "sale";
let district = params.get("district") || ALL;
let band10k = (() => {
  const raw = params.get("budget");
  if (raw === null || raw.trim() === "") return null;
  const value = Number(raw);
  return Number.isFinite(value) && value >= 0 ? value * EOK : null;
})();
const knownKey = (buckets, raw) => (buckets.some((b) => b.key === raw) ? raw : ALL);
let areaKey = knownKey(AREA_BUCKETS, params.get("area"));
let ageKey = knownKey(AGE_BUCKETS, params.get("age"));
let aptQuery = params.get("apt") ?? "";
let dongQuery = params.get("dong") ?? "";
let excludeDirect = params.get("direct") === "exclude";
// 거래 목록 대신 단지·평형 후보로 보기. 조건이 아니라 보는 방식이라 "조건 지우기"가 끄지 않는다.
let groupView = params.get("group") === "1";
let depositKey = knownKey(DEPOSIT_BUCKETS, params.get("deposit"));
let rentKey = knownKey(RENT_BUCKETS, params.get("rent"));

const isRent = () => kind !== "sale";

const aptTerm = () => aptQuery.trim();
const dongTerm = () => dongQuery.trim();
const detailActive = () =>
  areaKey !== ALL || ageKey !== ALL || aptTerm() !== "" || dongTerm() !== "" || excludeDirect;

const MONTHS_EN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function monthLabel(period) {
  const month = Number(String(period ?? "").slice(4, 6));
  if (!Number.isInteger(month) || month < 1 || month > 12) return "";
  return locale === "en" ? MONTHS_EN[month - 1] : `${month}월`;
}

/** "202608" → "2026년 8월" / "Aug 2026". 기준 달은 해가 바뀌는 자리에 걸칠 수 있어 해를 같이 적는다. */
function yearMonthLabel(period) {
  const text = String(period ?? "");
  const month = monthLabel(text);
  if (!month) return "";
  return locale === "en" ? `${month} ${text.slice(0, 4)}` : `${text.slice(0, 4)}년 ${month}`;
}

function formatEok(value10k) {
  if (typeof value10k !== "number" || !Number.isFinite(value10k)) return "-";
  const n = Math.round(value10k);
  if (locale === "en") return `₩${(n / 100).toLocaleString("en-US", { maximumFractionDigits: 0 })}M`;
  const eok = Math.floor(n / 10000);
  const man = n % 10000;
  if (!eok) return `${man.toLocaleString("ko-KR")}만원`;
  if (!man) return `${eok}억원`;
  return `${eok}억 ${man.toLocaleString("ko-KR")}만원`;
}

function dealWhen(date) {
  const [, month, day] = String(date ?? "").split("-");
  if (!month || !day) return "";
  return locale === "en" ? `${MONTHS_EN[Number(month) - 1]} ${Number(day)}` : `${Number(month)}/${Number(day)}`;
}

function bandLabel(band) {
  return t("bandLabel")(
    Math.round(band.min10k / EOK),
    band.max10k === null ? null : Math.round(band.max10k / EOK)
  );
}

const bucketOf = (buckets, key) => buckets.find((bucket) => bucket.key === key) ?? null;

function baseYear() {
  const periods = cache.search?.periods ?? cache.budget?.periods ?? [];
  const year = Number(String(periods[periods.length - 1] ?? "").slice(0, 4));
  return Number.isInteger(year) && year > 1900 ? year : null;
}

function matchesDetail(deal) {
  if (areaKey !== ALL) {
    const bucket = bucketOf(AREA_BUCKETS, areaKey);
    const area = Number(deal?.area);
    if (!bucket || !Number.isFinite(area)) return false;
    if (bucket.min !== null && area <= bucket.min) return false;
    if (bucket.max !== null && area > bucket.max) return false;
  }

  if (ageKey !== ALL) {
    const bucket = bucketOf(AGE_BUCKETS, ageKey);
    const year = baseYear();
    if (!bucket || !year || !Number.isInteger(deal?.buildYear)) return false;
    const age = year - deal.buildYear;
    if (bucket.within != null && age > bucket.within) return false;
    if (bucket.over != null && age < bucket.over) return false;
  }

  const term = aptTerm();
  if (term && !squash(deal?.apt).includes(squash(term))) return false;

  const dong = dongTerm();
  if (dong && !squash(deal?.dong).includes(squash(dong))) return false;

  if (excludeDirect && deal?.direct === true) return false;

  return true;
}

const scopeNames = () => (district === ALL ? districtNames() : [district]);

const needFull = () => district !== ALL || detailActive();

function fullDealsOf() {
  const names = scopeNames();
  if (!names.length) return null;

  const rows = [];
  for (const name of names) {
    const list = fullDeals.get(name);
    if (!list) return null;
    for (const deal of list) rows.push(deal.district ? deal : { ...deal, district: name });
  }

  return rows.sort((a, b) => String(b.date).localeCompare(String(a.date)) || b.amount10k - a.amount10k);
}

async function loadDistrictDeals(name) {
  const slug = cache.search?.slugs?.[name];
  if (!slug) {
    fullDeals.set(name, null);
    return;
  }
  try {
    const file = await loadJson(`deals-${slug}`);
    fullDeals.set(name, file?.deals ?? null);
    dealsFailed.delete(name);
  } catch (error) {
    dealsFailed.add(name);
    window.analytics?.event("exception", {
      description: `load deals-${slug}: ${error?.message ?? error}`.slice(0, 100),
      fatal: false,
    });
  }
}

async function loadDistrictRents(name) {
  const slug = cache.search?.slugs?.[name];
  if (!slug) {
    fullRents.set(name, null);
    return;
  }
  try {
    const file = await loadJson(`rents-${slug}`);
    fullRents.set(name, file?.deals ?? null);
    rentsFailed.delete(name);
  } catch (error) {
    rentsFailed.add(name);
    window.analytics?.event("exception", {
      description: `load rents-${slug}: ${error?.message ?? error}`.slice(0, 100),
      fatal: false,
    });
  }
}

async function loadComplexPrices(name) {
  const slug = cache.search?.slugs?.[name];
  if (!slug) {
    complexPrices.set(name, null);
    return;
  }
  try {
    complexPrices.set(name, await loadJson(`complex-price-${slug}`));
  } catch (error) {
    complexPrices.set(name, COMPLEX_FAILED);
    window.analytics?.event("exception", {
      description: `load complex-price-${slug}: ${error?.message ?? error}`.slice(0, 100),
      fatal: false,
    });
  }
}

function rentRows() {
  const rows = fullRents.get(district);
  if (!rows) return null;
  return rows
    .filter((deal) => (kind === "wolse" ? deal.monthlyRent10k > 0 : !(deal.monthlyRent10k > 0)))
    .map((deal) => (deal.district ? deal : { ...deal, district }))
    .sort((a, b) => String(b.date).localeCompare(String(a.date)) || b.deposit10k - a.deposit10k);
}

function inBucket(bucket, value) {
  if (!bucket || !Number.isFinite(value)) return false;
  if (bucket.min !== null && value < bucket.min) return false;
  if (bucket.max !== null && value >= bucket.max) return false;
  return true;
}

function matchesRent(deal) {
  if (depositKey !== ALL && !inBucket(bucketOf(DEPOSIT_BUCKETS, depositKey), Number(deal?.deposit10k))) {
    return false;
  }
  if (kind === "wolse" && rentKey !== ALL) {
    if (!inBucket(bucketOf(RENT_BUCKETS, rentKey), Number(deal?.monthlyRent10k))) return false;
  }
  return matchesDetail(deal);
}

function bandsFor(name) {
  if (name === ALL) return cache.budget?.bands ?? [];
  return cache.search?.districts?.[name] ?? [];
}

const districtNames = () => Object.keys(cache.search?.districts ?? {});

function bandOptions() {
  const seen = new Map();
  for (const band of cache.budget?.bands ?? []) seen.set(band.min10k, band);
  for (const bands of Object.values(cache.search?.districts ?? {})) {
    for (const band of bands) if (!seen.has(band.min10k)) seen.set(band.min10k, band);
  }
  return [...seen.values()].sort((a, b) => a.min10k - b.min10k);
}

function optionHtml(value, label, selected) {
  return `<option value="${escapeHtml(value)}"${selected ? " selected" : ""}>${escapeHtml(label)}</option>`;
}

function showField(id, visible) {
  const el = document.getElementById(id);
  if (el) el.hidden = !visible;
}

function renderControls() {
  const names = districtNames();

  chips("kind", KINDS.map((value) => ({
    value,
    label: t(value === "sale" ? "kindSale" : value === "jeonse" ? "kindJeonse" : "kindWolse"),
    on: value === kind,
  })));

  showField("budget-field", !isRent());
  showField("deposit-field", isRent());
  showField("rent-field", kind === "wolse");

  showField("group-field", !isRent());
  document.getElementById("group-check").checked = groupView;

  chips("deposit", [
    { value: ALL, label: t("allDeposits"), on: depositKey === ALL },

      value: bucket.key,
      label: t("depositOption")(bucket),
      on: bucket.key === depositKey,
    })),
  ]);

  chips("rent", [
    { value: ALL, label: t("allRents"), on: rentKey === ALL },

      )
      .join("");

  chips("area", [

    ...AREA_BUCKETS.map((bucket) => ({ value: bucket.key, label: t("areaOption")(bucket), on: bucket.key === areaKey })),
  ]);

    ...AGE_BUCKETS.map((bucket) => ({ value: bucket.key, label: t("ageOption")(bucket), on: bucket.key === ageKey })),
  ]);

  const aptInput = document.getElementById("apt-input");
  if (aptInput.value !== aptQuery) aptInput.value = aptQuery;
  aptInput.setAttribute("placeholder", t("aptPlaceholder"));

  document.getElementById("direct-check").checked = excludeDirect;

  const reset = document.getElementById("reset-filters");
  reset.textContent = t("resetFilters");
  document.getElementById("reset-field").hidden = !anyFilterOn();

function dealHtml(deal, name) {

  return (
    `<li class="budget-deal">` +
    `<span class="place">${escapeHtml(place)}</span>` +
    `<span class="spec">${escapeHtml(spec)}</span>` +
    (deal.direct === true ? `<span class="tag">${escapeHtml(t("directTag"))}</span>` : "") +
    `<span class="when">${escapeHtml(dealWhen(deal.date))}</span>` +

function scopeLabel(band) {

  if (areaKey !== ALL) parts.push(t("areaOption")(bucketOf(AREA_BUCKETS, areaKey)));

  if (aptTerm()) parts.push(t("aptScope")(aptTerm()));

const localeTag = () => (locale === "en" ? "en-US" : "ko-KR");

    [...counts.entries()]
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ko"))

function renderFromBands(box) {
  const bands = bandsFor(district);
  const band = band10k === null ? null : bands.find((b) => b.min10k === band10k) ?? null;
  const selected = band ? [band] : band10k === null ? bands : [];

  const count = selected.reduce((sum, b) => sum + (b.count ?? 0), 0);

  const top =
    district === ALL && band
      ? topDistrictsHtml((band.districts ?? []).map((d) => [d.name, d.count]))

  box.innerHTML = resultHtml(scopeLabel(band), count, rows, top, band);

// --- 단지 카드 --------------------------------------------------------------
//
// 검색에서 단지를 고르면 거래 목록만 나왔다. 목록은 "얼마에 팔렸나"에는 답하지만
// "이 단지 전세가율이 얼마냐"에는 답하지 않는다 - 그건 평형별로 매매와 전세를
// 각각 모아 봐야 나온다.
//
// 규칙은 scripts/complex-ratio.mjs와 같다. 한쪽이라도 세 건이 안 되면 값을 내지
// 않고 "표본 부족"이라고 적는다. 두 건으로 낸 중앙값은 그냥 두 값의 평균이다.
// 이 화면의 값어치는 숫자가 아니라 그 숫자를 낼 수 있었는지까지 보여주는 데 있다.

const COMPLEX_MIN_DEALS = 3;
const COMPLEX_RATIO_FLOOR = 5;
const COMPLEX_RATIO_CEILING = 130;

function medianOf(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const mid = sorted.length >> 1;
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

/** 고른 단지의 평형별 매매·전세 중앙값과 전세가율. 넓은 평형부터. */
/**
 * 빌드가 묶은 평형(1㎡ 안쪽 표기 차이)을 면적 → 묶음 이름으로. 묶는 규칙은 빌드(scripts/complex-price.mjs의
 * areaGroups) 한 곳에만 있다 - 여기서 다시 묶으면 두 벌의 규칙이 된다(#39). 빌드가 못 본 면적(여섯 달 안 매매가
 * 없는 전세 평형 등)은 제 면적 그대로 둔다.
 */
function areaLabels(cells) {
  const out = new Map();
  for (const [label, c] of Object.entries(cells ?? {})) {
    for (const area of c?.areas ?? [Number(label)]) out.set(Number(area), Number(label));
  }
  return out;
}

function complexAreas(apt, sales, rents, cells) {
  const term = squash(apt);
  if (!term) return [];
  const labels = areaLabels(cells);
  const byArea = new Map();
  const slot = (raw) => {
    const area = labels.get(Number(raw)) ?? raw;
    if (!byArea.has(area)) byArea.set(area, { area, members: new Set(), sale: [], jeonse: [] });
    const row = byArea.get(area);
    row.members.add(Number(raw));
    return row;
  };

  for (const deal of sales ?? []) {
    if (squash(deal?.apt) !== term) continue;
    const amount = Number(deal?.amount10k);
    if (amount > 0) slot(deal.area).sale.push(amount);
  }
  for (const deal of rents ?? []) {
    if (squash(deal?.apt) !== term) continue;
    // 갱신은 이전 조건을 잇는 것이라 지금 값이 아니고, 반전세는 한 값으로 못 묶는다.
    if (deal?.renewal === true || Number(deal?.monthlyRent10k ?? 0) > 0) continue;
    const deposit = Number(deal?.deposit10k);
    if (deposit > 0) slot(deal.area).jeonse.push(deposit);
  }

  return [...byArea.values()]
    .map((row) => {
      const sale = row.sale.length >= COMPLEX_MIN_DEALS ? medianOf(row.sale) : null;
      const jeonse = row.jeonse.length >= COMPLEX_MIN_DEALS ? medianOf(row.jeonse) : null;
      let ratio = null;
      if (sale && jeonse) {
        const value = (jeonse / sale) * 100;
        if (value > COMPLEX_RATIO_FLOOR && value < COMPLEX_RATIO_CEILING) ratio = value;
      }
      return { ...row, saleMedian: sale, jeonseMedian: jeonse, ratio };
    })
    .sort((a, b) => b.sale.length + b.jeonse.length - (a.sale.length + a.jeonse.length) || b.area - a.area);
}

/**
 * 친 글자로 단지를 하나로 좁힌다.
 *
 * 검색에서 고르면 이름이 그대로 넘어오지만, 단지명 칸에 손으로 칠 때는 "상계주공"처럼
 * 여러 단지에 걸리는 글자를 친다. 그때 카드를 그리면 상계주공4와 7을 한 단지처럼
 * 묶어 버리므로, 딱 하나로 좁혀질 때만 그린다.
 */
function resolveComplex(term, sales) {
  const q = squash(term);
  if (!q) return null;
  const names = new Set();
  for (const deal of sales ?? []) {
    const name = String(deal?.apt ?? "").trim();
    if (!name) continue;
    if (squash(name) === q) return name;
    if (squash(name).includes(q)) names.add(name);
  }
  return names.size === 1 ? [...names][0] : null;
}

/**
 * 이 단지 이 평형의 매매가 범위. 최근 여섯 달 거래를 권역 지수로 기준 달 값으로 고친 것이다.
 * 범위·중앙값·문턱은 빌드(scripts/complex-price.mjs)가 정했다 - 여기서 다시 세면 두 벌의 규칙이 된다.
 */
function complexPriceHtml(file, apt) {
  const areas = file?.cells?.[apt];
  if (!areas) return "";
  // 거래가 많은 평형부터 - 큰 평형부터 늘어놓으면 헬리오시티 84형이 넷째 블록이라 폰에서 한참 내려가야 했다(PO 2차 #41).
  const rows = Object.entries(areas).sort(([a, x], [b, y]) => (y.n ?? 0) - (x.n ?? 0) || Number(b) - Number(a));
  const unadjusted = rows.reduce((sum, [, c]) => sum + (c.unadjusted ?? 0), 0);
  const yearAgoMonths = rows.map(([, c]) => c.yearAgo?.months).find(Boolean) ?? null;

  const reference = yearMonthLabel(file.reference);
  // 평형마다 "지금 시세"(고친 중앙값 + 범위 + 건수) 한 칸과, 신고된 그대로의 값(고치기 전·1년 전·실제 최고)
  // 한 칸. 일곱 열이 같은 무게로 놓여 지금 시세가 안 가려지고 폰에서 한 평형이 일곱 줄이었다(UIUX #51).
  // 고친 값과 고치지 않은 값을 머리글로 가르는 것(#38)은 그대로 - 칸으로 가른다.
  const body = rows
    .map(([area, c]) => {
      // 같은 평형의 면적 표기 차이(1㎡ 안쪽)는 한 칸으로 묶었다 - 묶였으면 그 폭을 적는다(#32).
      const span = c.areas?.length > 1 ? ` <span class="count">${escapeHtml(`${c.areas[0]}~${c.areas.at(-1)}`)}</span>` : "";
      const head = `<td>${escapeHtml(`${area}㎡`)}${span}</td>`;
      if (!c.median) {
        return `<tr>${head}<td colspan="2"><span class="low-sample">${escapeHtml(t("priceThin")(c.n))}</span></td></tr>`;
      }
      const kind = t(c.quartile ? "priceMiddle" : "priceMinMax");
      const asFiled = [
        `${t("priceRaw")} ${formatEok(c.raw)}`,
        c.yearAgo ? `${t("priceYearAgo")} ${formatEok(c.yearAgo.median)}(${t("complexCount")(c.yearAgo.n)})` : null,
        c.top ? `${t("priceTopShort")} ${formatEok(c.top.amount)}${c.top.floor ? ` ${t("priceFloor")(c.top.floor)}` : ""}` : null,
      ].filter(Boolean);
      return (
        `<tr>${head}` +
        `<td data-label="${escapeHtml(t("priceNow")(reference))}"><strong class="price-strong">${escapeHtml(formatEok(c.median))}</strong>` +
        `<div class="sub">${escapeHtml(`${kind} ${formatEok(c.low)} ~ ${formatEok(c.high)} · ${t("complexCount")(c.n)}`)}</div></td>` +
        `<td data-label="${escapeHtml(t("priceAsFiled"))}" class="as-filed">${asFiled.map((x) => `<div class="sub">${escapeHtml(x)}</div>`).join("")}</td></tr>`
      );
    })
    .join("");

  const notes =
    (yearAgoMonths ? `<p class="content-notice">${escapeHtml(t("priceYearAgoNote")(yearAgoMonths))}</p>` : "") +
    (rows.some(([, c]) => c.top) ? `<p class="content-notice">${escapeHtml(t("priceTopNote"))}</p>` : "") +
    `<p class="content-notice">${escapeHtml(t("priceNote")(reference, file.referenceFilled, file.referenceBias, unadjusted))}</p>`;

  return (
    `<h3>${escapeHtml(t("priceHeading")(reference))}</h3>` +
    `<div class="table-wrap"><table class="data-table complex-price-table">` +
    // 이름에 단지·기준월·평형 수를 넣어 단지마다 다른 문장이 된다(#110).
    `<caption class="sr-only">${escapeHtml(`${apt} - ${t("priceHeading")(reference)} (${rows.length})`)}</caption><thead><tr>` +
    `<th scope="col">${escapeHtml(t("complexArea"))}</th><th scope="col">${escapeHtml(t("priceNow")(reference))}</th>` +
    `<th scope="col">${escapeHtml(t("priceAsFiled"))}</th></tr></thead><tbody>${body}</tbody></table></div>` +
    // 설명 셋(약 900자)은 접는다 - 지우지 않는다. 고치기 전 값을 옆에 두는 이유가 여기 있다.
    `<details class="fold"><summary>${escapeHtml(t("priceReadHow"))}</summary>${notes}</details>` +
    // 카드를 본 사람이 다음에 묻는 것(층 할인, 신고가)으로 가는 길(PO 검토 #33).
    `<p class="card-links"><a href="./floor-gap.html">${escapeHtml(t("cardFloorLink"))}</a> · ` +
    `<a href="./record-high.html">${escapeHtml(t("cardRecordLink"))}</a></p>`
  );
}

// 단지 가격 파일을 못 받았을 때 카드 안 가격 블록 자리에 실패를 말한다(#187). 가격 블록만 조용히
// 빠지면 "가격이 없는 단지"와 "받지 못한 것"이 같아 보인다. 404(null)는 실패가 아니라 이 자리를 비운다.
// 마크업은 공용 규칙(window.loadState)이 만들고, 카드 HTML에는 자리(#complex-price-status)만 둔다.
function renderComplexPriceFailure() {
  const slot = document.getElementById("complex-price-status");
  if (!slot) return;
  window.loadState.showFailure(slot, {
    message: t("groupLoadError"),
    retryLabel: t("retry"),
    retryId: "load-retry-price",
    wrap: (inner) => `<p class="empty">${inner}</p>`,
    onRetry: () => {
      window.analytics?.event("load_retry", { view: "complex_card" });
      refresh();
    },
  });
}

function complexCardHtml() {
  if (!aptTerm() || district === ALL) return "";
  const sales = fullDeals.get(district);
  const prices = complexFailed(district) ? null : complexPrices.get(district);
  // 두 달 목록에 없어도 여섯 달 안에 거래가 있으면 범위는 낼 수 있다. 이름은 양쪽에서 찾는다.
  const names = [...(sales ?? []), ...Object.keys(prices?.cells ?? {}).map((apt) => ({ apt }))];
  const apt = resolveComplex(aptTerm(), names);
  // 이름을 못 풀었는데 가격 파일이 실패였다면 "그 단지가 없다"인지 "여섯 달 쪽 이름을 못 봤다"인지
  // 알 수 없다. 카드를 통째로 빼면 실패가 조용한 누락이 되므로(#191) 실패 자리만 둔 카드를 보인다.
  // 가격 파일이 404(null)이거나 받았는데 이름이 없으면 정말 없는 단지라 이전처럼 카드를 안 그린다.
  if (!apt) return complexFailed(district) ? `<section class="complex-card"><div id="complex-price-status"></div></section>` : "";
  const rows = complexAreas(apt, sales, fullRents.get(district), prices?.cells?.[apt]);
  const priceFailed = complexFailed(district);
  const priceHtml = priceFailed ? `<div id="complex-price-status"></div>` : complexPriceHtml(prices, apt);
  if (!rows.length && !priceHtml) return "";

  const cell = (value, count) =>
    value === null
      ? `<span class="low-sample">${escapeHtml(t("complexThin")(count))}</span>`
      : `${escapeHtml(formatEok(value))} <span class="count">${escapeHtml(t("complexCount")(count))}</span>`;

  const ratioHtml = rows.length
    ? `<h3>${escapeHtml(t("ratioHeading"))}</h3>` +
      `<div class="table-wrap"><table class="data-table">` +
      `<caption class="sr-only">${escapeHtml(`${apt} - ${t("ratioHeading")} (${rows.length})`)}</caption><thead><tr>` +
      `<th scope="col">${escapeHtml(t("complexArea"))}</th><th scope="col">${escapeHtml(t("kindSale"))}</th>` +
      `<th scope="col">${escapeHtml(t("kindJeonse"))}</th><th scope="col">${escapeHtml(t("complexRatio"))}</th>` +
      `</tr></thead><tbody>` +
      rows
        .map(
          (row) =>
            `<tr><td>${escapeHtml(`${row.area}㎡`)}${
              row.members.size > 1
                ? ` <span class="count">${escapeHtml(`${Math.min(...row.members)}~${Math.max(...row.members)}`)}</span>`
                : ""
            }</td>` +
            `<td data-label="${escapeHtml(t("kindSale"))}">${cell(row.saleMedian, row.sale.length)}</td>` +
            `<td data-label="${escapeHtml(t("kindJeonse"))}">${cell(row.jeonseMedian, row.jeonse.length)}</td>` +
            `<td data-label="${escapeHtml(t("complexRatio"))}">${row.ratio === null ? "-" : `${row.ratio.toFixed(1)}%`}</td></tr>`
        )
        .join("") +
      `</tbody></table></div>` +
      `<p class="content-notice">${escapeHtml(t("complexNote"))}</p>`
    : "";

  // 범위를 먼저 둔다. 매물을 앞에 둔 사람이 먼저 묻는 것은 "이 값이 어디쯤인가"다.
  return (
    `<section class="complex-card">` +
    `<h2>${escapeHtml(t("complexHeading")(apt))}</h2>` +
    priceHtml +
    ratioHtml +
    `</section>`
  );
}

// --- 단지로 묶어 보기 ----------------------------------------------------------
//
// 거래 목록은 "언제 얼마에 팔렸나"다. 매물을 보러 다니기 전에 묻는 것은 "이 조건이면 어느 단지의
// 어느 평형인가"라서, 같은 조건을 단지·평형 단위(scripts/complex-price.mjs의 6개월 칸 요약)로
// 묶어 보여준다. 값은 빌드가 기준 달 값으로 고쳐 둔 것이고, 여기서는 거르기만 한다.
// 조건 필터 자체로 경쟁하지 않는다 - 그건 호갱노노가 더 많이 준다. 우리 몫은 후보마다 붙은
// 범위와 "몇 건으로 낸 값인가"다.

const GROUP_LIMIT = 100;

/** 칸 하나가 조건에 맞는가. skip에 든 조건은 보지 않는다(빈 결과에서 "이 조건을 풀면"을 셀 때). */
function groupMatches(row, skip = new Set()) {
  if (!skip.has("budget") && band10k !== null && !(row.median >= band10k && row.median < band10k + EOK)) return false;
  if (!skip.has("area") && areaKey !== ALL) {
    const bucket = bucketOf(AREA_BUCKETS, areaKey);
    if (!bucket) return false;
    if (bucket.min !== null && row.area <= bucket.min) return false;
    if (bucket.max !== null && row.area > bucket.max) return false;
  }
  if (!skip.has("age") && ageKey !== ALL) {
    const bucket = bucketOf(AGE_BUCKETS, ageKey);
    const year = baseYear();
    if (!bucket || !year || !Number.isInteger(row.buildYear)) return false;
    const age = year - row.buildYear;
    if (bucket.within != null && age > bucket.within) return false;
    if (bucket.over != null && age < bucket.over) return false;
  }
  if (!skip.has("apt") && aptTerm() && !squash(row.apt).includes(squash(aptTerm()))) return false;
  if (!skip.has("dong") && dongTerm() && !squash(row.dong).includes(squash(dongTerm()))) return false;
  return true;
}

/** 범위를 낼 수 있었던 칸만(같은 평형 6개월 3건 이상). 거래가 많은 순 - 많을수록 범위가 단단하다. */
function groupRows() {
  const rows = [];
  for (const name of scopeNames()) {
    const file = complexFailed(name) ? null : complexPrices.get(name);
    for (const [apt, areas] of Object.entries(file?.cells ?? {})) {
      for (const [area, cell] of Object.entries(areas)) {
        if (!cell.median) continue;
        rows.push({ district: name, apt, area: Number(area), ...file.meta?.[apt], ...cell, reference: file.reference });
      }
    }
  }
  return rows.sort((a, b) => b.n - a.n || a.median - b.median || (a.apt < b.apt ? -1 : 1));
}

function groupItemHtml(row) {
  const href = `./deal-search.html?district=${encodeURIComponent(row.district)}&apt=${encodeURIComponent(row.apt)}`;
  const facts = [row.district, row.dong, `${row.area}㎡`, row.buildYear ? t("groupBuilt")(row.buildYear) : null]
    .filter(Boolean)
    .join(" · ");
  return (
    `<li class="budget-deal"><a class="apt" href="${escapeHtml(href)}">${escapeHtml(row.apt)}</a>` +
    `<span class="meta">${escapeHtml(facts)}</span>` +
    `<span class="amount">${escapeHtml(formatEok(row.median))}</span>` +
    `<span class="meta">${escapeHtml(
      `${t(row.quartile ? "priceMiddle" : "priceMinMax")} ${formatEok(row.low)} ~ ${formatEok(row.high)} · ${t("complexCount")(row.n)}`
    )}</span></li>`
  );
}

function renderGroups(box) {
  // 실패가 로드 중보다 먼저다. 실패한 구가 하나라도 있으면 그 구를 뺀 순위를 내놓지 않는다 -
  // 빠진 구가 있는 "단지 순위"는 완전한 것처럼 읽힌다.
  if (scopeNames().some(complexFailed)) {
    window.loadState.showFailure(box, {
      message: t("groupLoadError"),
      retryLabel: t("retry"),
      wrap: (inner) => `<p class="empty">${inner}</p>`,
      onRetry: () => {
        window.analytics?.event("load_retry", { view: "group" });
        refresh();
      },
    });
    return;
  }
  const missing = scopeNames().filter((name) => !complexPrices.has(name));
  if (missing.length) {
    box.innerHTML = `<p class="search-loading">${escapeHtml(t("loading"))}</p>`;
    return;
  }
  const all = groupRows();
  const rows = all.filter((row) => groupMatches(row));
  const reference = all[0]?.reference;
  const month = reference ? yearMonthLabel(reference) : "";

  if (!rows.length) {
    // 조건 하나씩을 풀면 몇 곳이 되는가. 빈 화면에서 막히지 않게 다음 걸음을 숫자로 준다.
    const active = [
      ["budget", band10k !== null],
      ["area", areaKey !== ALL],
      ["age", ageKey !== ALL],
      ["apt", Boolean(aptTerm())],
      ["dong", Boolean(dongTerm())],
    ].filter(([, on]) => on);
    const relax = active
      .map(([key]) => [key, all.filter((row) => groupMatches(row, new Set([key]))).length])
      .filter(([, n]) => n > 0)
      .map(([key, n]) => t("groupRelax")(t(`groupCond_${key}`), n));
    if (district !== ALL) relax.push(t("groupRelaxDistrict"));
    box.innerHTML =
      `<p class="budget-empty">${escapeHtml(t("groupEmpty"))}</p>` +
      (relax.length ? `<ul class="group-relax">${relax.map((r) => `<li>${escapeHtml(r)}</li>`).join("")}</ul>` : "");
    return;
  }

  const counts = new Map();
  for (const row of rows) counts.set(row.district, (counts.get(row.district) ?? 0) + 1);
  const byDistrict =
    district === ALL
      ? `<div class="budget-districts">${escapeHtml(
          `${t("groupByDistrict")}: ${[...counts].sort((a, b) => b[1] - a[1]).map(([d, n]) => `${d} ${n}`).join(" · ")}`
        )}</div>`
      : "";
  box.innerHTML =
    `<p class="budget-summary">${escapeHtml(t("groupSummary")(rows.length, month))}</p>` +
    byDistrict +
    `<ul class="budget-deals">${rows.slice(0, GROUP_LIMIT).map(groupItemHtml).join("")}</ul>` +
    (rows.length > GROUP_LIMIT ? `<p class="budget-empty">${escapeHtml(t("groupMore")(GROUP_LIMIT))}</p>` : "") +
    `<p class="content-notice">${escapeHtml(t("groupNote"))}</p>`;
}

// 거래 목록(deals-*/rents-*)을 못 받았을 때 결과 자리에서 말한다(#196). 마크업은 공용 규칙이 만든다.
// 실패한 구를 뺀 결과를 내놓지 않는다 - 빠진 구가 있는 목록은 완전한 것처럼 읽힌다(renderGroups와 같은 선).
function renderListFailure(box, view, retryId) {
  window.loadState.showFailure(box, {
    message: t("loadError"),
    retryLabel: t("retry"),
    retryId,
    wrap: (inner) => `<p class="empty">${inner}</p>`,
    onRetry: () => {
      window.analytics?.event("load_retry", { view });
      refresh();
    },
  });
}

function renderResultBody() {
  const box = document.getElementById("search-result");

  if (isRent()) {
    if (rentPreviewUsable()) {
      renderRentPreview(box);
      return;
    }
    if (district === ALL) {
      box.innerHTML = `<p class="budget-empty">${escapeHtml(t("pickDistrict"))}</p>`;
      return;
    }
    if (rentsFailed.has(district)) {
      renderListFailure(box, "rents", "load-retry-rents");
      return;
    }
    renderRent(box);
    return;
  }

  if (groupView) {
    renderGroups(box);
    return;
  }

  if (needFull() && scopeNames().some((name) => dealsFailed.has(name))) {
    renderListFailure(box, "deals", "load-retry-deals");
    return;
  }

  const full = needFull() ? fullDealsOf() : null;
  if (full) {
    renderFull(box, full);
    return;
  }

  if (detailActive()) {
    box.innerHTML = `<p class="budget-empty">${escapeHtml(t("detailNotReady"))}</p>`;
    return;
  }

  renderFromBands(box);
}

function syncUrl() {
  const next = new URLSearchParams(location.search);
  const put = (key, value) => (value === null ? next.delete(key) : next.set(key, value));

  put("district", district === ALL ? null : district);
  put("budget", band10k === null ? null : String(Math.round(band10k / EOK)));
  put("area", areaKey === ALL ? null : areaKey);
  put("age", ageKey === ALL ? null : ageKey);
  put("apt", aptTerm() || null);
  put("dong", dongTerm() || null);
  put("direct", excludeDirect ? "exclude" : null);
  put("group", groupView ? "1" : null);
  put("kind", kind === "sale" ? null : kind);
  put("deposit", isRent() && depositKey !== ALL ? depositKey : null);
  put("rent", kind === "wolse" && rentKey !== ALL ? rentKey : null);

  const query = next.toString();
  const url = `${location.pathname}${query ? `?${query}` : ""}`;
  if (url !== `${location.pathname}${location.search}`) history.replaceState(null, "", url);
}

function renderUpdated() {
  const periods = cache.search?.periods ?? cache.budget?.periods ?? [];
  const updatedAt = cache.search?.updatedAt ?? cache.budget?.updatedAt;
  if (!periods.length) {
    setText("updated", "-");
    return;
  }
  const last = periods[periods.length - 1];
  setText(
    "updated",
    // 머리 날짜 줄은 사이트 어디서나 "<데이터 기준> · 갱신 <날짜>" 한 꼴이다(UIUX #49).
    t("dataThrough")(`${String(last).slice(0, 4)}.${String(last).slice(4, 6)}`) +
      (updatedAt
        ? ` · ${t("updatedWord")} ${new Date(updatedAt).toLocaleDateString(locale === "en" ? "en-US" : "ko-KR", { timeZone: "Asia/Seoul", dateStyle: "medium" })}`
        : "")
  );
}

const NAV_KEYS = {
  all: "navAll",
  sale: "navSale",
  jeonse: "navJeonse",
  wolse: "navWolse",
  search: "navDealSearch",
  conversion: "navConversion",
  renewal: "navRenewal",
  cancelled: "navCancelled",
};

function applyLocale() {
  document.title = t("title");
  setText("page-title", t("title"));
  setText("search-heading", t("searchHeading"));
  setText("district-label", t("districtLabel"));
  setText("budget-label", t("budgetLabel"));
  setText("kind-label", t("kindLabel"));
  setText("deposit-label", t("depositLabel"));
  setText("rent-label", t("rentLabel"));
  setText("area-label", t("areaLabel"));
  setText("age-label", t("ageLabel"));
  setText("apt-label", t("aptLabel"));
  setText("direct-label", t("directLabel"));
  setText("group-label", t("groupLabel"));
  setText("search-note", isRent() ? t("rentNote") : t("note"));
  setText("nav-digest", t("navDigest"));
  setText("nav-news", t("navNews"));
  setText("nav-realestate", t("navRealestatePrices"));
  setText("nav-rates", t("navRates"));
  setText("footer-source", t("footerSource"));
  setText("footer-privacy", t("footerPrivacy"));
  setText("footer-method", t("footerMethod"));
  setText("footer-about", t("footerAbout"));
  for (const link of document.querySelectorAll("[data-re-page]")) {
    link.textContent = t(NAV_KEYS[link.getAttribute("data-re-page")]);
  }
  document.documentElement.setAttribute("lang", locale);
}

let refreshToken = 0;

async function refresh() {
  const token = ++refreshToken;

  if (isRent()) {
    if (district !== ALL && !fullRents.has(district)) {
      document.getElementById("search-result").innerHTML =
        `<p class="search-loading">${escapeHtml(t("loading"))}</p>`;
      await loadDistrictRents(district);
      if (token !== refreshToken) return;
    }
    renderResult();
    return;
  }

  if (groupView) {
    const missing = scopeNames().filter((name) => !complexLoaded(name));
    if (missing.length) {
      document.getElementById("search-result").innerHTML =
        `<p class="search-loading">${escapeHtml(t("loading"))}</p>`;
      await Promise.all(missing.map(loadComplexPrices));
      if (token !== refreshToken) return;
    }
    renderResult();
    return;
  }

  if (needFull()) {
    const missing = scopeNames().filter((name) => !fullDeals.has(name));
    if (missing.length) {
      document.getElementById("search-result").innerHTML =
        `<p class="search-loading">${escapeHtml(t("loading"))}</p>`;
      await Promise.all(missing.map(loadDistrictDeals));
      if (token !== refreshToken) return;
    }
  }

  // 단지 카드는 매매와 전세를 나란히 놓아야 전세가율이 나온다. 매매 화면에서는
  // 전월세 파일을 안 받으므로, 단지를 고른 때에만 그 구의 것을 하나 더 받는다.
  if (aptTerm() && district !== ALL && (!fullRents.has(district) || !complexLoaded(district))) {
    await Promise.all([
      fullRents.has(district) ? null : loadDistrictRents(district),
      complexLoaded(district) ? null : loadComplexPrices(district),
    ]);
    if (token !== refreshToken) return;
  }

  renderResult();
}

function renderAll() {
  applyLocale();
  renderControls();
  refresh();
  renderUpdated();
}

async function loadJson(name) {
  const res = await fetch(`./data/${name}.json?_=${Date.now()}`);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function main() {
  applyTheme(theme);
  applyLocale();

  try {
    const [budget, search, rentPreview] = await Promise.all([
      loadJson("budget-deals"),
      loadJson("deal-search"),
      // 없으면 전과 똑같이 "자치구를 고르세요"로 돈다.
      loadJson("rent-preview").catch(() => null),
    ]);
    if (!budget || !search) {
      document.getElementById("search-controls").hidden = true;
      document.getElementById("search-result").innerHTML =
        `<p class="budget-empty">${escapeHtml(t("notReady"))}</p>`;
      setText("updated", "-");
      return;
    }

    cache.budget = budget;
    cache.search = search;
    cache.rentPreview = rentPreview;

    if (district !== ALL && !districtNames().includes(district)) district = ALL;
    syncUrl();
    renderAll();
  } catch (error) {
    window.analytics?.event("exception", {
      description: `load deal-search: ${error?.message ?? error}`.slice(0, 100),
      fatal: true,
    });
    document.getElementById("search-result").innerHTML =
      `<p class="empty">${escapeHtml(t("loadError"))} <button type="button" id="load-retry">${escapeHtml(t("retry"))}</button></p>`;
    document.getElementById("load-retry")?.addEventListener("click", (e) => {
      e.currentTarget.disabled = true;
      main();
    });
  }
}

/**
 * 셀렉트를 칩으로 바꾼 갈래들.
 *
 * 선택지가 서넛뿐인 조건을 셀렉트로 두면 고르는 데 세 번을 눌러야 하고, 무엇이
 * 켜져 있는지 보려면 일곱 칸을 하나씩 읽어야 했다. 칩은 한 번에 눌리고 켜진 것이
 * 그대로 보인다.
 *
 * 지역(25개)과 예산(29개)은 셀렉트로 남겼다. 칩 스물다섯 개를 가로로 훑어 은평구를
 * 찾는 것은 목록에서 고르는 것보다 나쁘다 - 칩이 언제나 나은 것이 아니라 선택지가
 * 적을 때 낫다.
 */
function chips(field, options) {
  const box = document.getElementById(`${field}-chips`);
  if (!box) return;
  box.innerHTML = options
    .map(
      (option) =>
        `<button type="button" class="chip" role="radio" data-filter="${escapeHtml(field)}"` +
        ` data-value="${escapeHtml(String(option.value))}" aria-checked="${option.on ? "true" : "false"}">` +
        `${escapeHtml(option.label)}</button>`
    )
    .join("");
}

/** 하나라도 걸려 있으면 '조건 지우기'가 뜬다. */
function anyFilterOn() {
  return (
    district !== ALL ||
    band10k !== null ||
    depositKey !== ALL ||
    rentKey !== ALL ||
    areaKey !== ALL ||
    ageKey !== ALL ||
    aptTerm() !== "" ||
    dongTerm() !== "" ||
    excludeDirect
  );
}

function clearFilters() {
  district = ALL;
  band10k = null;
  depositKey = ALL;
  rentKey = ALL;
  areaKey = ALL;
  ageKey = ALL;
  aptQuery = "";
  dongQuery = "";
  excludeDirect = false;
}

/** 칩 하나가 눌렸을 때. 셀렉트의 change와 같은 자리로 모은다. */
function onChipClick(event) {
  const chip = event.target?.closest?.("[data-filter]");
  if (!chip) return;
  const field = chip.dataset.filter;
  const value = chip.dataset.value;

  if (field === "kind") kind = KINDS.includes(value) ? value : "sale";
  else if (field === "deposit") depositKey = value || ALL;
  else if (field === "rent") rentKey = value || ALL;
  else if (field === "area") areaKey = value || ALL;
  else if (field === "age") ageKey = value || ALL;
  else return;

  afterControlChange();
}

function afterControlChange() {
  syncUrl();
  applyLocale();
  renderControls();
  refresh();
  window.analytics?.event("deal_search", {
    search_kind: kind,
    search_district: district,
    search_budget_eok: band10k === null ? ALL : String(Math.round(band10k / EOK)),
    search_area: areaKey,
    search_age: ageKey,
    search_apt_length: String(aptTerm().length),
    search_exclude_direct: excludeDirect,
  });
}

function onControlChange(e) {
  const id = e.target?.id;
  if (id === "kind-select") kind = KINDS.includes(e.target.value) ? e.target.value : "sale";
  else if (id === "deposit-select") depositKey = e.target.value || ALL;
  else if (id === "rent-select") rentKey = e.target.value || ALL;
  else if (id === "district-select") district = e.target.value || ALL;
  else if (id === "budget-select") {
    const raw = e.target.value;
    band10k = raw === ALL ? null : Number(raw) * EOK;
  } else if (id === "area-select") areaKey = e.target.value || ALL;
  else if (id === "age-select") ageKey = e.target.value || ALL;
  else if (id === "apt-input") aptQuery = String(e.target.value ?? "");
  else if (id === "direct-check") excludeDirect = Boolean(e.target.checked);
  else if (id === "group-check") groupView = Boolean(e.target.checked);
  else return;

  afterControlChange();
}

const controls = document.getElementById("search-controls");
controls.addEventListener("change", onControlChange);
controls.addEventListener("click", (event) => {
  if (event.target?.id === "reset-filters") {
    clearFilters();
    afterControlChange();
    return;
  }
  onChipClick(event);
});
controls.addEventListener("input", (e) => {
  if (e.target?.id === "apt-input") onControlChange(e);
});

document.getElementById("theme-toggle").addEventListener("click", () => {
  const order = ["auto", "light", "dark"];
  applyTheme(order[(order.indexOf(theme) + 1) % order.length]);
});

document.getElementById("lang-toggle").addEventListener("click", () => {
  locale = locale === "ko" ? "en" : "ko";
  window.localStorage.setItem("lang", locale);
  renderAll();
  window.analytics?.event("language_switch", { site_language: locale });
});

main();
</script>
</body>
</html>
